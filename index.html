<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            overflow:hidden;
        }
        .skyy{
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            top: 20%;
            left: 10%;
            background-color: #facc15;
            box-shadow: 0 0 40px #facc15, 0 0 80px #f97316;
            

            animation: suntomoon 6s ease-in-out infinite alternate;
        }
        

          
            @keyframes suntomoon {
                0%{
                    transform: tranlate(0,0) scale(1);
                    background-color: #facc15;
                    box-shadow: 0 0 40px #facc15, 0 0 80px #f97316;

                }
                35%{
                    transform: tranlate(0,0) scale(0.9);
                    background-color: #f97316;
                    box-shadow: 0 0 30px #f97316;

                }
                75%{
                    background-color: #e2e8f0;
                    box-shadow: inset  -20px 0px 0px #0f172a, 0 0 20px #e2e8f0;
                }
                100%{
                    transform: translate(360px, 0) scale(1);
                    background-color: #e2e8f0;
                    box-shadow: inset -25px 0px 0px 0px #0f172a, 0 0 25px rgba(226, 232,240, 0.4)
            
                }
    
        }
    </style>
</head>
<body>
    <div class="skyy">
        <div class="between"></div>
    </div>
    
</body>
</html>
